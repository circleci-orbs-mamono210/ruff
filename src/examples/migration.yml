---
description: >
  Migrate a repository that used flake8 and isort. Ruff 0.16.0 enables a much
  larger rule set than the 'E4,E7,E9,F' it shipped with before, so a first
  run against an established codebase usually reports a great deal. Pinning
  the old default set and adding back only the rules the previous tooling
  covered keeps the change reviewable. A second step reports on Ruff's
  default set with 'exit_zero', so its violations do not fail it; it runs
  only when the gate passed, and a configuration error still fails it. The
  Orb does not compare Ruff's findings with those of flake8 or isort, so
  compare them on the code before removing the old steps.
usage:
  version: 2.1
  orbs:
    ruff: orbss/ruff@1.0.0
  jobs:
    execute-ruff:
      executor: ruff/default
      steps:
        - checkout
        - ruff/install:
            version: 0.16.2

        # 'selected_rules' deliberately narrows the selection back to the
        # pre-0.16.0 default set, which contains neither the isort rules nor
        # 'E501', so both are added back explicitly: 'I' replaces isort and
        # 'E501' replaces the flake8 line length check.
        - ruff/check:
            extend_selected_rules: E501,I
            line_length: "100"
            selected_rules: E4,E7,E9,F
            targets: src

        # Report only. Shows what Ruff's default set reports, without gating
        # on its violations. Ruff 0.16.2's default set leaves out 18 rules of
        # 'E4,E7,E9,F', which the step above still checks.
        - ruff/check:
            exit_zero: true
            output_file: reports/ruff-full.txt
            statistics: true
            targets: src

        - store_artifacts:
            path: reports
  workflows:
    use-my-orb:
      jobs:
        - execute-ruff
