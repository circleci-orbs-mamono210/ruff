---
description: >
  Execute 'ruff check', the Ruff linter.
parameters:
  cache_dir:
    default: ''
    description: >
      Path to Ruff's cache directory (ruff '--cache-dir'). Empty keeps Ruff's
      default of '.ruff_cache' in the project root. Point this at a path
      covered by 'save_cache' to reuse results across builds.
    type: string
  color:
    default: auto
    description: >
      Colour the output (ruff '--color'). 'auto' colours only when stdout is
      a terminal, so a CircleCI job produces no colour. 'always' is useful on
      CircleCI, where the log renders ANSI escape sequences even though it is
      not a TTY. Ruff never writes colour into 'output_file' regardless of
      this setting.
    enum: ["auto", "always", "never"]
    type: enum
  config_file:
    default: ''
    description: >
      Path of a TOML config file to use (ruff '--config'), for example
      'build/ruff.toml'. Empty lets Ruff discover 'pyproject.toml',
      'ruff.toml' or '.ruff.toml' by walking up from each checked file.
      Cannot be combined with 'isolated'; Ruff rejects that combination
      itself.
    type: string
  config_overrides:
    default: ''
    description: >
      Newline separated list of TOML 'KEY = VALUE' pairs, each passed as its
      own ruff '--config' argument, for example
      'lint.dummy-variable-rgx = "^_$"'. These take precedence over every
      config file, including one named by 'config_file'. One pair per line,
      because a TOML pair contains whitespace and cannot be split on it.
      Blank lines are ignored.
    type: string
  diff:
    default: false
    description: >
      Print the diff each fix would produce instead of applying it
      (ruff '--diff'). Implies '--fix-only', so no violation report is
      printed, and the step fails when any diff exists unless 'exit_zero' is
      set. The diff goes to the job log even when 'output_file' is set; the
      file then only receives Ruff's summary line. Use it to show what 'fix'
      would change.
    type: boolean
  excluded_paths:
    default: ''
    description: >
      Comma separated list of file patterns to omit from the run
      (ruff '--exclude'). This REPLACES Ruff's default exclusion list, which
      covers '.git', '.venv', 'venv', 'dist', 'node_modules' and similar, so
      prefer 'extend_excluded_paths' unless that is intended.
    type: string
  exit_non_zero_on_fix:
    default: false
    description: >
      Fail the step when Ruff modified any file, even if no violations
      remain (ruff '--exit-non-zero-on-fix'). Only meaningful when 'fix' is
      set to 'safe' or 'unsafe'.
    type: boolean
  exit_zero:
    default: false
    description: >
      Exit with 0 even when Ruff reports violations (ruff '--exit-zero').
      Configuration errors and command line errors still fail the step,
      because Ruff exits 2 for those. A path that does not exist is reported
      as a violation and exits 1, so it IS masked by this option.
    type: boolean
  extend_excluded_paths:
    default: ''
    description: >
      Comma separated list of extra file patterns to omit on top of Ruff's
      default exclusion list (ruff '--extend-exclude').
    type: string
  extend_per_file_ignores:
    default: ''
    description: >
      Comma separated list of 'pattern:rule' pairs added on top of the
      per-file ignores already configured (ruff
      '--extend-per-file-ignores'), for example
      '__init__.py:F401,tests/*:S101'. Two differences from flake8 are worth
      knowing: the pairs are separated by commas rather than whitespace, and
      each pair carries exactly ONE rule code on the command line, so
      covering several rules under one pattern means repeating the pattern.
      The list form used in a config file, '"tests/*" = ["F401", "S101"]',
      is not accepted here.
    type: string
  extend_selected_rules:
    default: ''
    description: >
      Comma separated list of rule codes to enable on top of the current
      selection (ruff '--extend-select'), for example 'E501,D'. Unlike
      'selected_rules' this keeps the existing selection intact, so it is
      the usual way to add rules the default set leaves out, such as the
      line length rule 'E501' or the pydocstyle family 'D'.
    type: string
  extensions:
    default: ''
    description: >
      'extension:language' mappings (ruff '--extension'), for example
      'ipy:ipynb', separated by spaces, tabs or newlines. Empty lines are
      ignored, and each mapping is passed as its own '--extension'.
    type: string
  extra_args:
    default: ''
    description: >
      Extra arguments appended to the 'ruff check' invocation, for options
      this command does not expose, for example '--extend-fixable F401' or
      '--show-settings'. Separate them with spaces, tabs or newlines; empty
      lines are ignored. Nothing is evaluated, so quotes, '$', '~' and glob
      characters are passed as they are, and an argument that contains
      whitespace cannot be given.

      A few items are refused before Ruff is started, and the step then
      exits 1 without touching a file. '--' and any item that starts with
      '@' are always refused, because they change how the rest of the
      command line is read. Under 'fix: never', '--fix', '--fix-only',
      '--add-noqa' and '--add-ignore' are refused as well, each also in its
      'NAME=VALUE' form. Everything else is passed to Ruff as written. That
      it is accepted says nothing about what it does: Ruff decides how it
      combines with the other parameters.
    type: string
  fix:
    default: never
    description: >
      Whether Ruff may rewrite the checked files. 'never' passes '--no-fix'
      and '--no-fix-only', so the linter applies no fixes even when a config
      file or 'config_overrides' sets 'fix = true' or 'fix-only = true'.
      This is verified with Ruff 0.16.2 for runs set up through the
      parameters of this command. It does not cover 'extra_args' beyond the
      items refused there, or other Ruff versions, and the report and the
      cache are still written. 'auto' passes nothing, so the config file
      decides.
      'safe' passes '--fix --no-unsafe-fixes'. 'unsafe' passes
      '--fix --unsafe-fixes', which applies fixes that may not preserve the
      original intent of the code. A fixing run only makes sense when the
      job commits or diffs the result, so pair it with 'diff' or with
      'exit_non_zero_on_fix'.
    enum: ["never", "auto", "safe", "unsafe"]
    type: enum
  fix_only:
    default: false
    description: >
      Apply fixes but do not report on, or exit non-zero for, the violations
      that remain (ruff '--fix-only'). It asks Ruff to rewrite files, which
      'fix: never' forbids, so this command REFUSES the combination before
      Ruff is started rather than letting one override the other; set 'fix'
      to 'auto', 'safe' or 'unsafe' when a fixing run is intended.
    type: boolean
  fixable:
    default: ''
    description: >
      Comma separated list of rule codes that may be fixed
      (ruff '--fixable'). Only applies when fixing is enabled.
    type: string
  force_exclude:
    default: auto
    description: >
      Whether the exclusion patterns also apply to paths passed on the
      command line (ruff '--force-exclude' / '--no-force-exclude'). 'auto'
      passes nothing and lets the config file decide. Relevant when
      'targets' names a file directly, because Ruff otherwise checks an
      explicitly named file even if it is excluded.
    enum: ["auto", "enabled", "disabled"]
    type: enum
  ignore_noqa:
    default: false
    description: >
      Report violations on lines carrying a '# noqa' comment as well
      (ruff '--ignore-noqa'). Useful for auditing how many suppressions a
      project carries.
    type: boolean
  ignored_rules:
    default: ''
    description: >
      Comma separated list of rule codes to disable (ruff '--ignore'), for
      example 'E203,D203'. Applied after the selection, so it removes rules
      that 'selected_rules' or 'extend_selected_rules' turned on.
    type: string
  isolated:
    default: false
    description: >
      Ignore every config file (ruff '--isolated'), so only the parameters of
      this command decide the outcome. Ruff itself rejects this in
      combination with a 'config_file' path, but 'config_overrides' and
      'line_length' are inline settings rather than files, so both still
      apply under 'isolated'.
    type: boolean
  line_length:
    default: ''
    description: >
      Maximum allowed line length, passed as a
      '--config "line-length = N"' override. Empty keeps Ruff's default of
      88 or the value from the config file. Note that the line length limit
      is only REPORTED when rule 'E501' is selected, which Ruff's default
      rule set does not include; it also affects how other rules and the
      formatter wrap code.
    type: string
  no_cache:
    default: false
    description: >
      Disable cache reads (ruff '--no-cache'). Ruff's cache is keyed on file
      metadata and settings, so this is mainly useful when debugging a
      result that looks stale.
    type: boolean
  output_file:
    default: ''
    description: >
      Write the report to this path so it can be stored as an artifact
      (ruff '--output-file'). Ruff creates the parent directories, truncates
      an existing file and never writes colour into it. Ruff sends nothing to
      the job log while this is set, so see the 'tee' parameter.
    type: string
  output_format:
    default: default
    description: >
      Serialization format for the reported violations
      (ruff '--output-format'). 'default' passes no flag, so Ruff's own
      default of 'full' applies. 'github' emits workflow annotations,
      'junit' and 'sarif' suit report ingestion, and 'concise' gives one
      line per violation.
    enum: ["default", "concise", "full", "json", "json-lines", "junit",
           "grouped", "github", "gitlab", "pylint", "rdjson", "azure",
           "sarif"]
    type: enum
  per_file_ignores:
    default: ''
    description: >
      Comma separated list of 'pattern:rule' pairs applying different
      ignore lists to different files (ruff '--per-file-ignores'), for
      example '__init__.py:F401,tests/*:S101'. This REPLACES the per-file
      ignores from the config file, so prefer 'extend_per_file_ignores'
      unless that is intended. Each pair carries exactly ONE rule code, so
      covering several rules under one pattern means repeating the pattern.
    type: string
  preview:
    default: auto
    description: >
      Whether unstable rules and fixes are enabled (ruff '--preview' /
      '--no-preview'). 'auto' passes nothing and lets the config file
      decide. Preview rules can change or be removed between Ruff releases,
      so enabling them makes an unpinned Ruff version considerably riskier.
    enum: ["auto", "enabled", "disabled"]
    type: enum
  respect_gitignore:
    default: auto
    description: >
      Whether '.gitignore' and other standard ignore files exclude paths
      from the run (ruff '--respect-gitignore' / '--no-respect-gitignore').
      'auto' passes nothing and lets the config file decide. Ruff honours
      these files by default, which is a difference from flake8 worth
      knowing when generated code is both ignored by Git and expected to be
      linted.
    enum: ["auto", "enabled", "disabled"]
    type: enum
  selected_rules:
    default: ''
    description: >
      Comma separated list of rule codes to enable (ruff '--select'), or
      'ALL' for every rule. This REPLACES the selection rather than adding
      to it, so prefer 'extend_selected_rules' when the intent is to add
      rules. Setting 'E4,E7,E9,F' here restores the rule set Ruff enabled
      by default before 0.16.0, which is the documented way to keep an
      older configuration working across that upgrade.
    type: string
  show_fixes:
    default: auto
    description: >
      Whether an enumeration of the applied fixes is printed
      (ruff '--show-fixes' / '--no-show-fixes'). 'auto' passes nothing and
      lets the config file decide. Only meaningful when fixing is enabled.
    enum: ["auto", "enabled", "disabled"]
    type: enum
  statistics:
    default: false
    description: >
      Print a count per rule instead of the individual violations
      (ruff '--statistics'). This replaces the report rather than appending
      to it, including in 'output_file'.
    type: boolean
  target_version:
    default: default
    description: >
      Minimum Python version the checked code must support
      (ruff '--target-version'). 'default' passes no flag, so Ruff infers the
      version from 'requires-python' in 'pyproject.toml' and otherwise falls
      back to its own default. This drives version dependent rules such as
      the pyupgrade ('UP') family.
    enum: ["default", "py37", "py38", "py39", "py310", "py311", "py312",
           "py313", "py314", "py315"]
    type: enum
  targets:
    default: '.'
    description: >
      Files or directories to check, separated by spaces, tabs or newlines.
      Empty lines are ignored, and an empty or blank value means '.'. Every
      item is a path: the paths are passed after '--', and a relative path
      that starts with '-' or '@' gets './' in front, so none is read as an
      option, as standard input or as an argument file. Nothing is
      evaluated, so quotes, '$', '~' and glob characters are passed as they
      are, and a path that contains whitespace cannot be given. Pass options
      through 'extra_args'.
    type: string
  tee:
    default: true
    description: >
      When 'output_file' is set, also print the report to the CircleCI log.
      Ruff has no '--tee' of its own and writes to the file INSTEAD of
      standard output, so this command prints the file back to the log
      afterwards. The log copy carries no colour, because Ruff does not
      write colour into the file.
    type: boolean
  unfixable:
    default: ''
    description: >
      Comma separated list of rule codes that must never be fixed
      (ruff '--unfixable'). Only applies when fixing is enabled.
    type: string
  verbosity:
    default: default
    description: >
      Log verbosity. 'verbose' passes '--verbose' and reports what Ruff is
      doing, including which config file was resolved. 'quiet' passes
      '--quiet' and prints the violations only. 'silent' passes '--silent'
      and prints nothing while still exiting non-zero on violations.
    enum: ["default", "verbose", "quiet", "silent"]
    type: enum
steps:
  # One step on purpose. The script checks its input first, then prints
  # 'ruff --version' and only then runs Ruff, so a refused input starts
  # nothing. A separate version step would start Ruff before the check.
  - run:
      name: Execute ruff check
      environment:
        PARAM_CACHE_DIR: '<<parameters.cache_dir>>'
        PARAM_COLOR: '<<parameters.color>>'
        PARAM_CONFIG_FILE: '<<parameters.config_file>>'
        PARAM_CONFIG_OVERRIDES: '<<parameters.config_overrides>>'
        PARAM_DIFF: '<<parameters.diff>>'
        PARAM_EXCLUDED_PATHS: '<<parameters.excluded_paths>>'
        PARAM_EXIT_NON_ZERO_ON_FIX: '<<parameters.exit_non_zero_on_fix>>'
        PARAM_EXIT_ZERO: '<<parameters.exit_zero>>'
        PARAM_EXTEND_EXCLUDED_PATHS: '<<parameters.extend_excluded_paths>>'
        PARAM_EXTEND_PER_FILE_IGNORES: '<<parameters.extend_per_file_ignores>>'
        PARAM_EXTEND_SELECTED_RULES: '<<parameters.extend_selected_rules>>'
        PARAM_EXTENSIONS: '<<parameters.extensions>>'
        PARAM_EXTRA_ARGS: '<<parameters.extra_args>>'
        PARAM_FIX: '<<parameters.fix>>'
        PARAM_FIXABLE: '<<parameters.fixable>>'
        PARAM_FIX_ONLY: '<<parameters.fix_only>>'
        PARAM_FORCE_EXCLUDE: '<<parameters.force_exclude>>'
        PARAM_IGNORED_RULES: '<<parameters.ignored_rules>>'
        PARAM_IGNORE_NOQA: '<<parameters.ignore_noqa>>'
        PARAM_ISOLATED: '<<parameters.isolated>>'
        PARAM_LINE_LENGTH: '<<parameters.line_length>>'
        PARAM_NO_CACHE: '<<parameters.no_cache>>'
        PARAM_OUTPUT_FILE: '<<parameters.output_file>>'
        PARAM_OUTPUT_FORMAT: '<<parameters.output_format>>'
        PARAM_PER_FILE_IGNORES: '<<parameters.per_file_ignores>>'
        PARAM_PREVIEW: '<<parameters.preview>>'
        PARAM_RESPECT_GITIGNORE: '<<parameters.respect_gitignore>>'
        PARAM_SELECTED_RULES: '<<parameters.selected_rules>>'
        PARAM_SHOW_FIXES: '<<parameters.show_fixes>>'
        PARAM_STATISTICS: '<<parameters.statistics>>'
        PARAM_TARGETS: '<<parameters.targets>>'
        PARAM_TARGET_VERSION: '<<parameters.target_version>>'
        PARAM_TEE: '<<parameters.tee>>'
        PARAM_UNFIXABLE: '<<parameters.unfixable>>'
        PARAM_VERBOSITY: '<<parameters.verbosity>>'
      command: <<include(scripts/check.sh)>>
