---
description: >
  Execute 'ruff format', the Ruff formatter.

  The default mode is 'check', which reports the files that would be
  reformatted instead of rewriting them.
parameters:
  cache_dir:
    default: ''
    description: >
      Path to Ruff's cache directory (ruff '--cache-dir'). Empty keeps Ruff's
      default of '.ruff_cache' in the project root.
    type: string
  color:
    default: auto
    description: >
      Colour the output (ruff '--color'). 'auto' colours only when stdout is
      a terminal, so a CircleCI job produces no colour. 'always' is useful on
      CircleCI, where the log renders ANSI escape sequences even though it is
      not a TTY, and makes a 'diff' mode run considerably easier to read.
    enum: ["auto", "always", "never"]
    type: enum
  config_file:
    default: ''
    description: >
      Path of a TOML config file to use (ruff '--config'), for example
      'build/ruff.toml'. Empty lets Ruff discover 'pyproject.toml',
      'ruff.toml' or '.ruff.toml'. Cannot be combined with 'isolated'; Ruff
      rejects that combination itself.
    type: string
  config_overrides:
    default: ''
    description: >
      Newline separated list of TOML 'KEY = VALUE' pairs, each passed as its
      own ruff '--config' argument, for example
      'format.quote-style = "single"'. These take precedence over every
      config file. One pair per line, because a TOML pair contains
      whitespace and cannot be split on it. Blank lines are ignored.
    type: string
  excluded_paths:
    default: ''
    description: >
      Comma separated list of file patterns to omit from the run
      (ruff '--exclude'). This REPLACES Ruff's default exclusion list, so
      prefer 'extend_excluded_paths' unless that is intended.
    type: string
  exit_non_zero_on_format:
    default: false
    description: >
      Fail the step when Ruff reformatted any file, even though the
      formatting itself succeeded (ruff '--exit-non-zero-on-format'). Only
      meaningful in 'write' mode, where it turns a job that rewrites files
      into one that also reports having done so.
    type: boolean
  extend_excluded_paths:
    default: ''
    description: >
      Comma separated list of extra file patterns to omit on top of Ruff's
      default exclusion list (ruff '--extend-exclude').
    type: string
  extensions:
    default: ''
    description: >
      'extension:language' mappings (ruff '--extension'), for example
      'ipy:ipynb', separated by spaces, tabs or newlines. Empty lines are
      ignored, and each mapping is passed as its own '--extension'.
    type: string
  extra_args:
    default: ''
    description: >
      Extra arguments appended to the 'ruff format' invocation, for options
      this command does not expose. Separate them with spaces, tabs or
      newlines; empty lines are ignored. Nothing is evaluated, so quotes, '$', '~' and glob
      characters are passed as they are, and an argument that contains
      whitespace cannot be given.

      In every mode, '--' and any item that starts with '@' are refused
      before Ruff is started, because they change how the rest of the
      command line is read. The step then exits 1 without touching a file.
      Everything else is passed to Ruff as written. That it is accepted says
      nothing about what it does: Ruff decides how it combines with the
      other parameters.
    type: string
  force_exclude:
    default: auto
    description: >
      Whether the exclusion patterns also apply to paths passed on the
      command line (ruff '--force-exclude' / '--no-force-exclude'). 'auto'
      passes nothing and lets the config file decide.
    enum: ["auto", "enabled", "disabled"]
    type: enum
  isolated:
    default: false
    description: >
      Ignore every config file (ruff '--isolated'), so only the parameters of
      this command decide the outcome. Ruff itself rejects this in
      combination with a 'config_file' path, but 'config_overrides' and
      'line_length' are inline settings rather than files, so both still
      apply under 'isolated'.
    type: boolean
  line_length:
    default: ''
    description: >
      Maximum line length the formatter wraps to (ruff '--line-length').
      Empty keeps Ruff's default of 88 or the value from the config file.
      Keep this in step with the 'line_length' used by 'ruff/check', because
      the formatter and the 'E501' rule are configured independently on the
      command line.
    type: string
  mode:
    default: check
    description: >
      What the formatter does with the files.

      'check' passes '--check', reports which files would be reformatted and
      fails the step if there are any. This is the mode a CI gate wants.

      'diff' passes '--diff' and additionally prints the exact changes, which
      makes a failure actionable from the log alone.

      Neither of the two rewrites the files it is given. This is verified
      with Ruff 0.16.2 for runs set up through the parameters of this
      command, including settings from a config file or 'config_overrides'.
      It does not cover 'extra_args' or other Ruff versions, and the cache
      is still written.

      'write' passes neither and REWRITES the files in place, which only
      makes sense when the job goes on to commit or otherwise use the result.
    enum: ["check", "diff", "write"]
    type: enum
  no_cache:
    default: false
    description: >
      Disable cache reads (ruff '--no-cache').
    type: boolean
  output_format:
    default: default
    description: >
      Serialization format used when reporting the files that would be
      reformatted (ruff '--output-format'). Only applies in 'check' mode.
      'default' passes no flag, so Ruff's own default of 'full' applies, and
      'github' emits workflow annotations.
    enum: ["default", "concise", "full", "json", "json-lines", "junit",
           "grouped", "github", "gitlab", "pylint", "rdjson", "azure",
           "sarif"]
    type: enum
  preview:
    default: auto
    description: >
      Whether unstable formatting is enabled (ruff '--preview' /
      '--no-preview'). 'auto' passes nothing and lets the config file decide.
      Preview formatting can change between Ruff releases, so enabling it
      makes an unpinned Ruff version considerably riskier.
    enum: ["auto", "enabled", "disabled"]
    type: enum
  respect_gitignore:
    default: auto
    description: >
      Whether '.gitignore' and other standard ignore files exclude paths
      from the run (ruff '--respect-gitignore' / '--no-respect-gitignore').
      'auto' passes nothing and lets the config file decide.
    enum: ["auto", "enabled", "disabled"]
    type: enum
  target_version:
    default: default
    description: >
      Minimum Python version the formatted code must support
      (ruff '--target-version'). 'default' passes no flag, so Ruff infers the
      version from 'requires-python' in 'pyproject.toml' and otherwise falls
      back to its own default.
    enum: ["default", "py37", "py38", "py39", "py310", "py311", "py312",
           "py313", "py314", "py315"]
    type: enum
  targets:
    default: '.'
    description: >
      Files or directories to format, separated by spaces, tabs or newlines.
      Empty lines are ignored, and an empty or blank value means '.'. Every
      item is a path: the paths are passed after '--', and a relative path
      that starts with '-' or '@' gets './' in front, so none is read as an
      option, as standard input or as an argument file. Nothing is
      evaluated, so quotes, '$', '~' and glob characters are passed as they
      are, and a path that contains whitespace cannot be given. Pass options
      through 'extra_args'.

      Since Ruff 0.16.0 the formatter also reformats Python code blocks
      inside Markdown files, so a target of '.' reaches every '.md' file in
      the repository. Add '*.md' to 'extend_excluded_paths' when that is not
      wanted.
    type: string
  verbosity:
    default: default
    description: >
      Log verbosity. 'verbose' passes '--verbose' and reports what Ruff is
      doing, including which config file was resolved. 'quiet' passes
      '--quiet'. 'silent' passes '--silent' and prints nothing while still
      exiting non-zero in 'check' and 'diff' mode.
    enum: ["default", "verbose", "quiet", "silent"]
    type: enum
steps:
  # One step on purpose. The script checks its input first, then prints
  # 'ruff --version' and only then runs Ruff, so a refused input starts
  # nothing. A separate version step would start Ruff before the check.
  - run:
      name: Execute ruff format
      environment:
        PARAM_CACHE_DIR: '<<parameters.cache_dir>>'
        PARAM_COLOR: '<<parameters.color>>'
        PARAM_CONFIG_FILE: '<<parameters.config_file>>'
        PARAM_CONFIG_OVERRIDES: '<<parameters.config_overrides>>'
        PARAM_EXCLUDED_PATHS: '<<parameters.excluded_paths>>'
        PARAM_EXIT_NON_ZERO_ON_FORMAT: '<<parameters.exit_non_zero_on_format>>'
        PARAM_EXTEND_EXCLUDED_PATHS: '<<parameters.extend_excluded_paths>>'
        PARAM_EXTENSIONS: '<<parameters.extensions>>'
        PARAM_EXTRA_ARGS: '<<parameters.extra_args>>'
        PARAM_FORCE_EXCLUDE: '<<parameters.force_exclude>>'
        PARAM_ISOLATED: '<<parameters.isolated>>'
        PARAM_LINE_LENGTH: '<<parameters.line_length>>'
        PARAM_MODE: '<<parameters.mode>>'
        PARAM_NO_CACHE: '<<parameters.no_cache>>'
        PARAM_OUTPUT_FORMAT: '<<parameters.output_format>>'
        PARAM_PREVIEW: '<<parameters.preview>>'
        PARAM_RESPECT_GITIGNORE: '<<parameters.respect_gitignore>>'
        PARAM_TARGETS: '<<parameters.targets>>'
        PARAM_TARGET_VERSION: '<<parameters.target_version>>'
        PARAM_VERBOSITY: '<<parameters.verbosity>>'
      command: <<include(scripts/format.sh)>>
