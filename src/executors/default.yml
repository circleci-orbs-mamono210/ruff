---
description: >
  CircleCI Python executor for running Ruff. This executor does not include
  Ruff, so run ruff/install before ruff/check or ruff/format.
docker:
  - image: '<<parameters.image>>'
parameters:
  image:
    default: cimg/python:3.14
    type: string
  resource_class:
    default: small
    enum: ["small", "medium", "medium+", "large"]
    type: enum
resource_class: '<<parameters.resource_class>>'
