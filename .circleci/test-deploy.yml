version: 2.1

# Orb Development Kit, second half. orb-tools/continue in
# .circleci/config.yml starts this configuration after replacing the empty
# 'ruff' entry below with the Orb that its pack job built from this commit.
# Every 'ruff/...' step here therefore runs that Orb, not a version from the
# registry.
orbs:
  ruff: {}
  orb-tools: circleci/orb-tools@12.5.0

filters: &filters
  tags:
    only: /.*/

commands:
  record-fixtures:
    description: >
      Fail early when a fixture the tests rely on is missing or empty, and
      take a snapshot of every file under tests/. Ruff exits 0 when it finds
      no Python files, so an empty checkout would make every test pass for
      the wrong reason. Run it once, right after checkout, so that
      verify-fixtures-unchanged compares with the files of the commit.
    steps:
      - run:
          name: Verify the fixtures and record a snapshot of tests/
          command: bash tests/fixtures.sh record /tmp/fixtures.sha256

  verify-fixtures-unchanged:
    description: >
      Fail when a file under tests/ differs from the snapshot that
      record-fixtures took after checkout. Use it after every step that
      rewrites a fixture and restores it, and at the end of every job that
      uses the fixtures, so that a fixture left modified cannot let a later
      test pass for the wrong reason.
    parameters:
      after:
        description: What the check follows. It only names the step.
        type: string
        default: the tests
    steps:
      - run:
          name: Verify the fixtures are unchanged after << parameters.after >>
          command: bash tests/fixtures.sh verify /tmp/fixtures.sha256

  record-environment:
    description: >
      Record the commit, the job, the image, Python, Ruff and the CPU and
      memory limits of this job in /tmp/environment/<job>.json, and store
      the record as an artifact. Run it after ruff/install. The step fails
      unless Ruff is the version below, which every ruff/install step of
      this file installs.
    parameters:
      ruff_version:
        description: The Ruff version the integration tests are pinned to.
        type: string
        default: "0.16.2"
    steps:
      - run:
          name: Record the execution environment
          command: >-
            python3 tests/environment/record.py
            --ruff-version '<< parameters.ruff_version >>'
            /tmp/environment
      - store_artifacts:
          path: /tmp/environment
          destination: environment

  locate-packed-orb:
    description: >
      Copy the orb that orb-tools/pack packed from this commit to
      /tmp/packed-orb.yml and install PyYAML for the scripts that read it.
      orb-tools/pack 12.5.0 persists the orb as orb_source.tar.gz at the
      root of the workspace, and the archive holds orb.yml. A plain orb.yml
      is accepted as well, and the step fails when neither is there.
    steps:
      - attach_workspace:
          at: dist

      - run:
          name: Locate the packed orb
          command: |
            set -euo pipefail

            while IFS= read -r archive; do
              tar -xzf "${archive}" -C "$(dirname "${archive}")"
            done < <(find dist -type f -name 'orb_source.tar.gz')

            echo 'Files from the workspace:'
            find dist -type f -print

            packed="$(find dist -type f -name 'orb.yml' | LC_ALL=C sort | head -n 1)"

            if [ -z "${packed}" ] || [ ! -s "${packed}" ]; then
              echo 'The workspace holds no packed orb.yml'
              exit 1
            fi

            cp "${packed}" /tmp/packed-orb.yml
            echo "Commit: ${CIRCLE_SHA1:-unknown}"
            sha256sum /tmp/packed-orb.yml

      - run:
          name: Install PyYAML
          command: python -m pip install --quiet pyyaml==6.0.3

jobs:
  # The published commands with their parameters at the defaults, apart from
  # what a step names, on ruff/default with its defaults as well. The
  # environment this job records is what executor-comparison compares the
  # other executor tests with.
  command-tests:
    executor: ruff/default
    steps:
      - checkout
      - record-fixtures

      - ruff/install:
          version: "0.16.2"

      - record-environment

      - persist_to_workspace:
          root: /tmp
          paths:
            - environment/command-tests.json

      # The clean fixture has no violations under the default rule set, so
      # the default parameters must pass.
      - ruff/check:
          targets: tests/clean

      # The same fixture is formatted, so the formatter gate must pass too.
      - ruff/format:
          targets: tests/clean

      # Every parameter but 'targets', 'output_file' and 'exit_zero' is at its
      # default; the last two make the step write a report instead of
      # failing. The next step checks the report against what the defaults
      # have to give, the default rule set in Ruff's default output format,
      # and verify-fixtures-unchanged after it that nothing was fixed. It also
      # checks that check.sh with tests/defaults/check.sh writes the same
      # report. tests/defaults/compare.py cannot see a default that was
      # changed the same way in src/commands/check.yml and in
      # tests/defaults/check.sh; these checks see one that changes the rules,
      # the format or the fixing.
      - ruff/check:
          exit_zero: true
          output_file: reports/defaults/orb.txt
          targets: tests/violations

      - run:
          name: Verify the default check against the shared defaults
          command: |
            set -euo pipefail

            source tests/defaults/check.sh

            echo 'check.sh with tests/defaults/check.sh:'
            PARAM_EXIT_ZERO='true' \
            PARAM_OUTPUT_FILE='reports/defaults/script.txt' \
            PARAM_TARGETS='tests/violations' \
              bash src/scripts/check.sh

            echo 'Report of ruff/check:'
            cat reports/defaults/orb.txt

            failures=0

            # One environment came from CircleCI and one from the file, so
            # both runs must have written the same report.
            if ! cmp -s reports/defaults/orb.txt reports/defaults/script.txt; then
              diff -u reports/defaults/orb.txt reports/defaults/script.txt || true
              echo 'check.sh with the shared defaults wrote a different report'
              failures=1
            fi

            # The default rule set covers pyflakes and isort, and each
            # fixture holds one violation.
            for code in F401 F821 I001; do
              if ! grep -q "^${code} " reports/defaults/orb.txt; then
                echo "The default rule set did not report ${code}"
                failures=1
              fi
            done

            if ! grep -Fxq 'Found 3 errors.' reports/defaults/orb.txt; then
              echo 'Expected exactly three violations'
              failures=1
            fi

            # Ruff's default output format, 'full', points at each violation
            # with a ' --> path:line:column' line.
            if ! grep -Fxq ' --> tests/violations/unused_import.py:3:8' \
              reports/defaults/orb.txt; then
              echo "The report is not in Ruff's default output format"
              failures=1
            fi

            exit "${failures}"

      # 'fix: never' is the default, so the report runs must have left the
      # fixtures alone, although F401 and I001 are fixable.
      - verify-fixtures-unchanged:
          after: the default check

      - store_artifacts:
          path: reports

  parameter-tests:
    executor: ruff/default
    steps:
      - checkout
      - record-fixtures

      - ruff/install:
          version: "0.16.2"

      - record-environment

      # E501 is not in the default rule set, so the clean fixture only stops
      # being clean once both the rule and a short line length are supplied.
      # E501 in the report is what proves line_length reached Ruff.
      - ruff/check:
          exit_zero: true
          extend_selected_rules: E501
          line_length: "40"
          output_file: reports/line-length.txt
          targets: tests/clean/compliant.py

      - run:
          name: Verify line_length changed the outcome
          command: |
            set -euo pipefail

            test -s reports/line-length.txt

            echo 'Report contents:'
            cat reports/line-length.txt

            grep -q 'E501' reports/line-length.txt

            if grep -q "$(printf '\033')" reports/line-length.txt; then
              echo 'Report contains ANSI escape sequences'
              exit 1
            fi

      # Ruff truncates the output file rather than appending to it. Re-running
      # the same step must therefore leave the same number of findings.
      - ruff/check:
          exit_zero: true
          extend_selected_rules: E501
          line_length: "40"
          output_file: reports/line-length.txt
          targets: tests/clean/compliant.py

      - run:
          name: Verify the report is replaced between runs
          command: |
            set -euo pipefail

            echo 'Report contents:'
            cat reports/line-length.txt

            occurrences="$(grep -c 'E501' reports/line-length.txt)"

            if [ "${occurrences}" -ne 4 ]; then
              echo "Expected 4 E501 lines, got ${occurrences}"
              exit 1
            fi

      # unused_import.py violates F401 only, so this passes if and only if
      # ignored_rules is honoured.
      - ruff/check:
          ignored_rules: F401
          targets: tests/violations/unused_import.py

      # unsorted_imports.py violates I001 only, and unused_import.py violates
      # F401 only. Selecting F must therefore report the second and drop the
      # first.
      - ruff/check:
          exit_zero: true
          output_file: reports/select.txt
          selected_rules: F
          targets: tests/violations

      - run:
          name: Verify selected_rules limited the report
          command: |
            set -euo pipefail

            echo 'Report contents:'
            cat reports/select.txt

            grep -q 'F401' reports/select.txt

            if grep -q 'I001' reports/select.txt; then
              echo 'selected_rules did not limit the reported rules'
              exit 1
            fi

      # Restoring the pre-0.16.0 default set must drop I001 as well, because
      # the isort rules are not part of it.
      - ruff/check:
          exit_zero: true
          output_file: reports/legacy-defaults.txt
          selected_rules: E4,E7,E9,F
          targets: tests/violations

      - run:
          name: Verify the legacy default set excludes isort
          command: |
            set -euo pipefail

            echo 'Report contents:'
            cat reports/legacy-defaults.txt

            grep -q 'F401' reports/legacy-defaults.txt
            grep -q 'F821' reports/legacy-defaults.txt

            if grep -q 'I001' reports/legacy-defaults.txt; then
              echo 'The legacy default set unexpectedly reported I001'
              exit 1
            fi

      # Directory scanning plus exclusion. Only tests/clean, tests/line-length
      # and tests/unformatted survive, and none of them reports a violation,
      # so this passes only when extend_excluded_paths is applied.
      - ruff/check:
          extend_excluded_paths: tests/violations
          targets: tests

      # Ruff separates the per_file_ignores pairs with commas, unlike flake8.
      - ruff/check:
          per_file_ignores: "tests/violations/unused_import.py:F401,tests/violations/unsorted_imports.py:I001,tests/violations/undefined_name.py:F821"
          targets: tests/violations

      # Each entry is a single 'pattern:rule' pair, so covering three rules
      # under one pattern means repeating the pattern three times.
      - ruff/check:
          extend_per_file_ignores: "tests/violations/*:F401,tests/violations/*:I001,tests/violations/*:F821"
          targets: tests/violations

      # excluded_paths replaces Ruff's default exclusion list. Nothing below
      # tests/ but tests/violations has a finding, so this passes only when
      # the value reached Ruff.
      - ruff/check:
          excluded_paths: tests/violations
          targets: tests

      # Ruff checks a file named in targets even when it is excluded, unless
      # force_exclude is enabled. unused_import.py reports F401, so this
      # passes only when force_exclude reached Ruff.
      - ruff/check:
          extend_excluded_paths: tests/violations/unused_import.py
          force_exclude: enabled
          targets: tests/violations/unused_import.py

      # The JSON report must parse and hold the one finding of each fixture in
      # tests/violations, with its code and position.
      - ruff/check:
          exit_zero: true
          output_file: reports/output-format.json
          output_format: json
          targets: tests/violations

      - run:
          name: Verify output_format json reached Ruff
          command: |
            python3 -c '
            import json
            import pathlib
            import sys

            findings = json.loads(pathlib.Path(sys.argv[1]).read_text())
            found = sorted(
                (
                    pathlib.Path(f["filename"]).name,
                    f["code"],
                    f["location"]["row"],
                    f["location"]["column"],
                )
                for f in findings
            )
            expected = [
                ("undefined_name.py", "F821", 6, 12),
                ("unsorted_imports.py", "I001", 3, 1),
                ("unused_import.py", "F401", 3, 8),
            ]
            print(found)
            sys.exit(0 if found == expected else f"Expected {expected}")
            ' reports/output-format.json

      # diff prints to the log the change each fix would make, and exits 1
      # when there is one, which exit_zero turns into 0. Ruff writes only its
      # summary to output_file. The fixture must stay as it is.
      - ruff/check:
          diff: true
          exit_zero: true
          output_file: reports/diff.txt
          targets: tests/violations/unsorted_imports.py

      - run:
          name: Verify diff reached Ruff
          command: grep -Fxq 'Would fix 1 error.' reports/diff.txt

      - verify-fixtures-unchanged:
          after: the diff run

      # cache_dir moves Ruff's cache out of the project.
      - ruff/check:
          cache_dir: /tmp/ruff-cache-dir
          targets: tests/clean

      - run:
          name: Verify cache_dir reached Ruff
          command: test -f /tmp/ruff-cache-dir/CACHEDIR.TAG

      # Smoke test for argument construction: whitespace separated targets
      # together with several independent flags.
      - ruff/check:
          color: always
          no_cache: true
          statistics: true
          target_version: py311
          targets: tests/clean tests/clean/compliant.py
          verbosity: verbose

      # Verify that multiple extra arguments are split and passed to Ruff.
      # Neither option changes the reported violations, so the step only fails
      # if the splitting itself is broken.
      - ruff/check:
          extra_args: --extend-fixable F401 --no-show-fixes
          targets: tests/clean

      # extra_args that are not refused still run through the published
      # command, one per line, and the step prints the Ruff version first.
      # '--show-settings' makes Ruff print its settings instead of checking.
      # What reaches Ruff for these and what is refused is asserted by
      # tests/arguments/regression.sh below.
      - ruff/check:
          extra_args: |
            --extend-fixable F401
            --no-show-fixes
          targets: tests/clean

      - ruff/check:
          extra_args: --show-settings
          targets: tests/clean/compliant.py

      # Ruff exits 2 on a configuration or command line error without
      # touching output_file, so an earlier run's report must not be printed
      # or kept as this run's result. The script seeds each report with a
      # marker and covers success, violations and errors with tee on and off,
      # repeated runs into the same file, and failures to prepare or read the
      # report. It invokes check.sh directly because several cases must fail.
      # The reports it keeps under reports/report-regression are stored with
      # the others, so a leaked marker would also show in the artifacts. The
      # log is kept for the comparison with tests/arguments/check-parameters.md
      # below.
      - run:
          name: Verify the report reflects only the latest run
          command: |
            mkdir -p /tmp/regression-logs
            bash tests/report/regression.sh | tee /tmp/regression-logs/report.log

      # config_overrides carries whitespace inside each value, so this proves
      # the parameter is split on newlines rather than on whitespace.
      - ruff/check:
          config_overrides: |
            lint.extend-select = ["E501"]
            line-length = 40
          exit_zero: true
          output_file: reports/config-overrides.txt
          targets: tests/clean/compliant.py

      - run:
          name: Verify config_overrides reached Ruff
          command: |
            set -euo pipefail

            echo 'Report contents:'
            cat reports/config-overrides.txt

            grep -q 'E501' reports/config-overrides.txt

      # 'tee' is what puts the report in the job log. With it disabled the
      # report must reach the file only.
      - run:
          name: Verify tee controls the log output
          command: |
            set -euo pipefail

            source tests/defaults/check.sh

            set +e
            output="$(
              PARAM_EXIT_ZERO='true' \
              PARAM_OUTPUT_FILE='reports/no-tee.txt' \
              PARAM_TARGETS='tests/violations/unused_import.py' \
              PARAM_TEE='false' \
                bash src/scripts/check.sh
            )"
            status=$?
            set -e

            printf '%s\n' "${output}"

            if [ "${status}" -ne 0 ]; then
              echo "Expected exit_zero to succeed, got ${status}"
              exit 1
            fi

            if printf '%s\n' "${output}" | grep -q 'F401'; then
              echo 'Report reached the log even though tee was disabled'
              exit 1
            fi

            grep -q 'F401' reports/no-tee.txt

            echo 'tee correctly controlled the log output.'

      - run:
          name: Verify tee prints the report back to the log
          command: |
            set -euo pipefail

            source tests/defaults/check.sh

            set +e
            output="$(
              PARAM_EXIT_ZERO='true' \
              PARAM_OUTPUT_FILE='reports/tee.txt' \
              PARAM_TARGETS='tests/violations/unused_import.py' \
                bash src/scripts/check.sh
            )"
            status=$?
            set -e

            printf '%s\n' "${output}"

            if [ "${status}" -ne 0 ]; then
              echo "Expected exit_zero to succeed, got ${status}"
              exit 1
            fi

            if ! printf '%s\n' "${output}" | grep -q 'F401'; then
              echo 'Report did not reach the log even though tee was enabled'
              exit 1
            fi

      # 'fix: never' must keep the checkout untouched. F401 and I001 are both
      # fixable, so an accidental rewrite would be visible in the fixtures.
      - run:
          name: Verify fix never rewrites the checkout
          command: |
            set -euo pipefail

            before="$(cat tests/violations/unused_import.py tests/violations/unsorted_imports.py)"

            source tests/defaults/check.sh

            set +e
            PARAM_EXIT_ZERO='true' \
            PARAM_TARGETS='tests/violations' \
              bash src/scripts/check.sh > /dev/null
            set -e

            after="$(cat tests/violations/unused_import.py tests/violations/unsorted_imports.py)"

            if [ "${before}" != "${after}" ]; then
              echo 'The fixtures were modified despite fix: never'
              exit 1
            fi

            echo 'The checkout was left untouched.'

      # The complement of the test above: 'fix: safe' must actually rewrite
      # the checkout, which is what proves 'fix: never' is suppressing
      # something rather than passing a flag with no effect. I001 is fixable,
      # so the fixture is repaired and then restored.
      - run:
          name: Verify fix safe rewrites and exit_non_zero_on_fix reports it
          command: |
            set -euo pipefail

            cp tests/violations/unsorted_imports.py /tmp/unsorted_imports.orig

            source tests/defaults/check.sh

            set +e
            PARAM_EXIT_NON_ZERO_ON_FIX='true' \
            PARAM_FIX='safe' \
            PARAM_TARGETS='tests/violations/unsorted_imports.py' \
              bash src/scripts/check.sh
            status=$?
            set -e

            if diff -q /tmp/unsorted_imports.orig tests/violations/unsorted_imports.py; then
              echo 'fix: safe did not rewrite the fixture'
              cp /tmp/unsorted_imports.orig tests/violations/unsorted_imports.py
              exit 1
            fi

            # I001 is the fixture's only violation and it is fixable, so
            # nothing remains to report and the status comes solely from
            # exit_non_zero_on_fix. Ruff uses 1 for that and 2 for an error.
            if [ "${status}" -ne 1 ]; then
              echo "Expected exit status 1, got ${status}"
              cp /tmp/unsorted_imports.orig tests/violations/unsorted_imports.py
              exit 1
            fi

            cp /tmp/unsorted_imports.orig tests/violations/unsorted_imports.py

            echo 'fix: safe correctly rewrote the fixture.'

      # The two tests above must leave the fixtures as they were, or the
      # tests below would run on a repaired fixture.
      - verify-fixtures-unchanged:
          after: the fix tests

      # '--fix-only' implies '--fix' and wins over '--no-fix', so the command
      # refuses the combination rather than rewriting files silently.
      - run:
          name: Verify fix_only cannot be combined with fix never
          command: |
            set -euo pipefail

            source tests/defaults/check.sh

            set +e
            PARAM_FIX_ONLY='true' \
            PARAM_TARGETS='tests/clean' \
              bash src/scripts/check.sh
            status=$?
            set -e

            # The guard is the command's own, and it exits 1.
            if [ "${status}" -ne 1 ]; then
              echo "Expected exit status 1, got ${status}"
              exit 1
            fi

            echo 'The fix_only/fix combination correctly failed.'

      # The command documents that Ruff rejects 'isolated' together with a
      # 'config_file' path. Assert that, so the documentation cannot go stale
      # without a test noticing.
      - run:
          name: Verify isolated and config_file cannot be combined
          command: |
            set -euo pipefail

            source tests/defaults/check.sh

            printf 'line-length = 40\n' > /tmp/probe-config.toml

            set +e
            PARAM_CONFIG_FILE='/tmp/probe-config.toml' \
            PARAM_ISOLATED='true' \
            PARAM_TARGETS='tests/clean' \
              bash src/scripts/check.sh
            status=$?
            set -e

            # Ruff exits 2 for a configuration error, so an exact check
            # distinguishes the refusal from a violation report.
            if [ "${status}" -ne 2 ]; then
              echo "Expected exit status 2, got ${status}"
              exit 1
            fi

            # The config file exists, so a failure here can only come from the
            # combination itself rather than from a missing path.
            test -s /tmp/probe-config.toml

            echo 'The isolated/config_file combination correctly failed.'

      # Ruff draws its isolated/config line at FILES, not at settings, so an
      # inline override must still apply under isolated. F401 is the
      # fixture's only violation, so ignoring it via an override is what
      # makes the step pass.
      - run:
          name: Verify isolated accepts config overrides
          command: |
            set -euo pipefail

            source tests/defaults/check.sh

            PARAM_CONFIG_OVERRIDES='lint.ignore = ["F401"]' \
            PARAM_ISOLATED='true' \
            PARAM_TARGETS='tests/violations/unused_import.py' \
              bash src/scripts/check.sh

            echo 'Config overrides were applied under isolated.'

      # 'line_length' is passed as an inline override too, so it must survive
      # isolated as well. E501 in the report is what proves it arrived.
      - ruff/check:
          exit_zero: true
          extend_selected_rules: E501
          isolated: true
          line_length: "40"
          output_file: reports/isolated-line-length.txt
          targets: tests/clean/compliant.py

      - run:
          name: Verify line_length survives isolated
          command: |
            set -euo pipefail

            echo 'Report contents:'
            cat reports/isolated-line-length.txt

            grep -q 'E501' reports/isolated-line-length.txt

      # Ruff exits 2 for a missing config file and for a command line error,
      # and exit_zero applies to reported violations only.
      - run:
          name: Verify exit_zero does not mask configuration errors
          command: |
            set -euo pipefail

            source tests/defaults/check.sh

            set +e
            PARAM_CONFIG_FILE='no-such-config.toml' \
            PARAM_EXIT_ZERO='true' \
            PARAM_TARGETS='tests/clean' \
              bash src/scripts/check.sh
            config_status=$?
            set -e

            # The README documents 2 as the configuration-error status, so
            # assert it exactly rather than merely asserting a failure.
            if [ "${config_status}" -ne 2 ]; then
              echo "Expected exit status 2, got ${config_status}"
              exit 1
            fi

            echo 'The configuration error correctly remained a failure.'

      # Verify that targets and extra_args are split into arrays without Bash
      # pathname expansion. Both values below match files or directories in
      # the checkout if normal glob expansion is accidentally performed.
      - run:
          name: Verify argument splitting does not expand globs
          command: |
            set -euo pipefail

            source tests/defaults/check.sh

            set +e
            output="$(
              PARAM_EXIT_ZERO='true' \
              PARAM_EXTRA_ARGS='--extend-exclude *.pyi' \
              PARAM_TARGETS='tests/*' \
                bash src/scripts/check.sh 2>&1
            )"
            status=$?
            set -e

            printf '%s\n' "${output}"
            echo "ruff exit status: ${status}"

            command_line="$(
              printf '%s\n' "${output}" |
                grep '^Command:' |
                head -n 1
            )"

            if [ -z "${command_line}" ]; then
              echo 'Command line was not printed'
              exit 1
            fi

            # printf %q escapes the literal '*' as '\*'. If Bash expanded the
            # globs before invoking Ruff, these strings would not exist.
            if ! printf '%s\n' "${command_line}" |
              grep -Fq -- '--extend-exclude \*.pyi'; then
              echo 'extra_args glob was expanded unexpectedly'
              exit 1
            fi

            if ! printf '%s\n' "${command_line}" |
              grep -Fq -- 'tests/\*'; then
              echo 'targets glob was expanded unexpectedly'
              exit 1
            fi

            echo 'Globs were preserved as literal Ruff arguments.'

      # targets, extensions and extra_args are split on spaces, tabs and
      # newlines, and the paths follow '--', with './' in front of a relative
      # path that starts with '-' or '@'. The script compares what a recording
      # stand-in for Ruff receives with the expected lists, then runs Ruff
      # 0.16.2 on files named '-', '--help' and '@args'.
      #
      # It also covers what check.sh refuses. Each refused extra_args item
      # runs check.sh as a child process, and the case passes only when that
      # process exits 1, the stand-in was not started even for
      # 'ruff --version', and the target and an existing report are unchanged.
      # A refusal is therefore never a failing step of this job. With the
      # real Ruff it checks that 'fix: never' leaves a file alone when
      # ruff.toml, pyproject.toml or config_overrides set 'fix-only = true'.
      # packed-command-tests checks that the published command runs this
      # same check.sh. Everything happens in a temporary directory, so
      # nothing is added to reports/.
      - run:
          name: Verify the arguments passed to Ruff and the refused input
          command: |
            mkdir -p /tmp/regression-logs
            bash tests/arguments/regression.sh check |
              tee /tmp/regression-logs/arguments-check.log

      # tests/arguments/check-parameters.md lists the cases of both regression
      # scripts, and the cases that ran must be exactly those.
      - run:
          name: Verify check-parameters.md lists the regression cases that ran
          command: >-
            python3 tests/arguments/check-parameters.py
            --regression-log tests/report/regression.sh
            /tmp/regression-logs/report.log
            --regression-log tests/arguments/regression.sh
            /tmp/regression-logs/arguments-check.log

      - store_artifacts:
          path: /tmp/regression-logs
          destination: regression-logs

      - verify-fixtures-unchanged:
          after: the parameter tests

      # store_artifacts below stores every report this job writes, so it has
      # to stay the last step. This step checks the reports first. The files
      # must match the list below one to one, and tests/README.md documents
      # the same list. The reports listed as empty must be empty and all
      # others must have content. No report may carry the stale-report marker
      # of tests/report/regression.sh. The manifest printed at the end ties
      # the stored files to this commit and job. store_artifacts runs even
      # after a failed step, so it can also store reports that failed this
      # check or never reached it. Treat the stored reports as verified only
      # when this step and the whole job have both succeeded. CircleCI may
      # skip empty files when uploading; see tests/README.md for how to
      # compare the artifacts with this list.
      - run:
          name: Verify the reports to be stored
          command: |
            set -euo pipefail

            non_empty=(
              reports/config-overrides.txt
              reports/diff.txt
              reports/isolated-line-length.txt
              reports/legacy-defaults.txt
              reports/line-length.txt
              reports/no-tee.txt
              reports/output-format.json
              reports/report-regression/exit-zero-violations.txt
              reports/report-regression/rerun-clean.txt
              reports/report-regression/rerun.txt
              reports/report-regression/success-no-tee.txt
              reports/report-regression/success-tee.txt
              reports/report-regression/violations-no-tee.txt
              reports/report-regression/violations-tee.txt
              reports/select.txt
              reports/tee.txt
            )

            # check.sh empties output_file before Ruff runs. These runs stop
            # on a configuration error, or run under 'quiet' or 'silent', so
            # Ruff writes nothing and the report is empty by design.
            empty=(
              reports/report-regression/config-error-no-tee.txt
              reports/report-regression/config-error-tee.txt
              reports/report-regression/exit-zero-config-error.txt
              reports/report-regression/rerun-config-error.txt
              reports/report-regression/rerun-empty-failure.txt
              reports/report-regression/rerun-empty-success.txt
            )

            failures=0

            printf '%s\n' "${non_empty[@]}" "${empty[@]}" |
              LC_ALL=C sort > /tmp/expected-reports.txt
            find reports -type f | LC_ALL=C sort > /tmp/actual-reports.txt

            if ! diff -u /tmp/expected-reports.txt /tmp/actual-reports.txt; then
              echo 'The reports differ from the expected list'
              failures=1
            fi

            for report in "${non_empty[@]}"; do
              if [ ! -s "${report}" ]; then
                echo "Expected a report with content: ${report}"
                failures=1
              fi
            done

            for report in "${empty[@]}"; do
              if [ ! -f "${report}" ] || [ -s "${report}" ]; then
                echo "Expected an empty report: ${report}"
                failures=1
              fi
            done

            # Read the marker from the script that seeds it, so the two
            # cannot drift apart unnoticed.
            if ! marker="$(
              grep -m 1 '^STALE_MARKER=' tests/report/regression.sh |
                cut -d "'" -f 2
            )" || [ -z "${marker}" ]; then
              echo 'STALE_MARKER was not found in tests/report/regression.sh'
              exit 1
            fi

            set +e
            grep -rlF -- "${marker}" reports
            marker_status=$?
            set -e

            case "${marker_status}" in
              0)
                echo "The reports above carry the stale-report marker ${marker}"
                failures=1
                ;;
              1)
                ;;
              *)
                echo 'The reports could not be searched for the marker'
                failures=1
                ;;
            esac

            echo "Commit: ${CIRCLE_SHA1:-unknown}"
            echo "Job: ${CIRCLE_BUILD_URL:-unknown}"
            echo 'Reports to be stored (bytes, SHA-256, path):'

            while IFS= read -r report; do
              printf '%s %s %s\n' \
                "$(wc -c < "${report}")" \
                "$(sha256sum "${report}" | cut -d ' ' -f 1)" \
                "${report}"
            done < /tmp/actual-reports.txt

            exit "${failures}"

      - store_artifacts:
          path: reports

  format-tests:
    executor: ruff/default
    steps:
      - checkout

      # Several tests below rewrite a fixture and restore it. The snapshot
      # lets verify-fixtures-unchanged prove after each of them, and at the
      # end, that nothing was left modified.
      - record-fixtures

      - ruff/install:
          version: "0.16.2"

      - record-environment

      # The clean fixture is already formatted, so the default check mode
      # must pass on it.
      - ruff/format:
          targets: tests/clean

      # The unformatted fixture passes 'ruff check' under the default rule
      # set but must fail the formatter gate. Running the command through the
      # step would fail the job, so the script is invoked directly. 'mode' is
      # left at the shared default, which must be 'check'.
      - run:
          name: Verify check mode fails on an unformatted file
          command: |
            set -euo pipefail

            source tests/defaults/format.sh

            before="$(cat tests/unformatted/spacing.py)"

            set +e
            PARAM_TARGETS='tests/unformatted' \
              bash src/scripts/format.sh
            status=$?
            set -e

            if [ "${status}" -eq 0 ]; then
              echo 'check mode passed on an unformatted file'
              exit 1
            fi

            after="$(cat tests/unformatted/spacing.py)"

            if [ "${before}" != "${after}" ]; then
              echo 'check mode modified the file'
              exit 1
            fi

            echo 'check mode correctly failed without modifying the file.'

      # 'write' mode is the only mode that rewrites files, and the rewritten
      # file must then satisfy the check mode.
      - run:
          name: Verify write mode reformats the file
          command: |
            set -euo pipefail

            cp tests/unformatted/spacing.py /tmp/spacing.py.orig

      - ruff/format:
          mode: write
          targets: tests/unformatted

      - ruff/format:
          targets: tests/unformatted

      - run:
          name: Restore the unformatted fixture
          command: |
            set -euo pipefail

            if diff -q /tmp/spacing.py.orig tests/unformatted/spacing.py; then
              echo 'write mode left the file unchanged'
              exit 1
            fi

            cp /tmp/spacing.py.orig tests/unformatted/spacing.py

            echo 'write mode correctly reformatted the file.'

      - verify-fixtures-unchanged:
          after: the write mode test

      # 'diff' mode must fail like 'check' mode and additionally print the
      # changes, while still leaving the file alone.
      - run:
          name: Verify diff mode fails without modifying the file
          command: |
            set -euo pipefail

            source tests/defaults/format.sh

            before="$(cat tests/unformatted/spacing.py)"

            set +e
            output="$(
              PARAM_MODE='diff' \
              PARAM_TARGETS='tests/unformatted' \
                bash src/scripts/format.sh 2>&1
            )"
            status=$?
            set -e

            printf '%s\n' "${output}"

            if [ "${status}" -eq 0 ]; then
              echo 'diff mode passed on an unformatted file'
              exit 1
            fi

            if [ "${before}" != "$(cat tests/unformatted/spacing.py)" ]; then
              echo 'diff mode modified the file'
              exit 1
            fi

            # 'check' mode reports only which files would change; 'diff' mode
            # is distinguished by printing the change itself.
            if ! printf '%s\n' "${output}" | grep -q 'VALUES'; then
              echo 'diff mode did not print the change'
              exit 1
            fi

            echo 'diff mode correctly failed and printed the change.'

      # 'exit_non_zero_on_format' turns a successful rewrite into a failure,
      # which is how a 'write' mode job reports that it changed something.
      - run:
          name: Verify exit_non_zero_on_format reports a rewrite
          command: |
            set -euo pipefail

            source tests/defaults/format.sh

            cp tests/unformatted/spacing.py /tmp/spacing.py.enzof

            set +e
            PARAM_EXIT_NON_ZERO_ON_FORMAT='true' \
            PARAM_MODE='write' \
            PARAM_TARGETS='tests/unformatted' \
              bash src/scripts/format.sh
            status=$?
            set -e

            cp /tmp/spacing.py.enzof tests/unformatted/spacing.py

            if [ "${status}" -ne 1 ]; then
              echo "Expected exit status 1, got ${status}"
              exit 1
            fi

            echo 'exit_non_zero_on_format correctly reported the rewrite.'

      # The line_length test below starts from the fixtures as checked out.
      - verify-fixtures-unchanged:
          after: the exit_non_zero_on_format test

      # line_length has to travel from the Orb to Ruff. The two fixtures give
      # opposite answers at Ruff's default of 88 and at 40:
      # tests/clean/compliant.py is formatted at 88 but not at 40, and
      # tests/line-length/formatted_at_40.py is formatted at 40 but not at 88.
      # A value that is dropped or replaced on the way therefore changes at
      # least one result. The cases run format.sh, assert the exact exit
      # status and a line of the output, and confirm that check and diff
      # leave the fixture untouched.
      - run:
          name: Verify line_length reaches the formatter through format.sh
          command: |
            set -euo pipefail

            source tests/defaults/format.sh

            failures=0

            run_format() {
              PARAM_LINE_LENGTH="$2" \
              PARAM_MODE="$1" \
              PARAM_TARGETS="$3" \
                bash src/scripts/format.sh
            }

            # check_case NAME MODE LINE_LENGTH FILE STATUS LINE
            #
            # Runs format.sh on FILE and expects exit STATUS, LINE as a whole
            # line of the output, and FILE unchanged afterwards.
            check_case() {
              local before output status

              before="$(sha256sum "$4")"

              set +e
              output="$(run_format "$2" "$3" "$4" 2>&1)"
              status=$?
              set -e

              echo "----- $1 (exit status ${status}) -----"
              printf '%s\n' "${output}"

              if [ "${status}" -ne "$5" ]; then
                echo "FAIL [$1]: expected exit status $5, got ${status}"
                failures=$((failures + 1))
              fi

              if ! printf '%s\n' "${output}" | grep -Fxq -- "$6"; then
                echo "FAIL [$1]: the output has no line '$6'"
                failures=$((failures + 1))
              fi

              if [ "$(sha256sum "$4")" != "${before}" ]; then
                echo "FAIL [$1]: $2 mode modified $4"
                failures=$((failures + 1))
              fi
            }

            wide=tests/clean/compliant.py
            narrow=tests/line-length/formatted_at_40.py

            # Without line_length both fixtures give the default answer. A
            # value that never reached Ruff would give the same answer at 40.
            check_case wide-default check '' "${wide}" 0 \
              '1 file already formatted'
            check_case narrow-default check '' "${narrow}" 1 \
              '1 file would be reformatted'

            check_case wide-40 check 40 "${wide}" 1 \
              '1 file would be reformatted'
            check_case narrow-40 check 40 "${narrow}" 0 \
              '1 file already formatted'

            # diff prints the wrapping that line_length 40 produces. The check
            # mode output shows the same code with line numbers in front, so
            # this whole line only appears in diff mode.
            check_case wide-40-diff diff 40 "${wide}" 1 \
              '+    build_greeting("world"),'

            if [ "${failures}" -ne 0 ]; then
              echo "${failures} line_length assertion(s) failed"
              exit 1
            fi

            echo 'line_length reached Ruff through format.sh in check and diff mode.'

      # The same check through the Orb command, which also covers the mapping
      # from the line_length parameter to PARAM_LINE_LENGTH in
      # src/commands/format.yml. The fixture is formatted at 40 but not at
      # Ruff's default, so this step passes only when the value reaches Ruff.
      - ruff/format:
          line_length: "40"
          targets: tests/line-length/formatted_at_40.py

      # extra_args that are not refused still run through the published
      # command, and the step prints the Ruff version first.
      - ruff/format:
          extra_args: |
            --no-force-exclude
            --no-preview
          targets: tests/clean

      # The same argument and refusal cases as in parameter-tests, against
      # format.sh. With the real Ruff they also check that the 'check' and
      # 'diff' modes leave a file alone when ruff.toml, pyproject.toml or
      # config_overrides make the formatter want to change it. They work in a
      # temporary directory, so the fixtures stay untouched.
      - run:
          name: Verify the arguments passed to Ruff and the refused input
          command: bash tests/arguments/regression.sh format

      # Every test above restores what it changes. Comparing with the
      # snapshot catches a fixture that was left modified, or a file that was
      # left behind, either of which could let a later test pass for the
      # wrong reason.
      - verify-fixtures-unchanged:
          after: the format tests

  # tests/arguments/regression.sh runs src/scripts/check.sh and format.sh
  # directly. This job ties those results to the published commands: it
  # takes the orb that orb-tools/pack packed from this commit and checks
  # that 'check' and 'format' each consist of one step, that the step runs
  # exactly the script the tests ran, that every parameter is handed to it,
  # and that the script refuses input before it starts Ruff, including
  # 'ruff --version', or writes a file. It also checks that the shared
  # defaults those tests start from are the defaults of the packed commands.
  packed-command-tests:
    docker:
      - image: cimg/python:3.13
    steps:
      - checkout
      - locate-packed-orb

      - run:
          name: Verify the packed commands check their input before Ruff starts
          command: python tests/arguments/packed-commands.py /tmp/packed-orb.yml

      - run:
          name: Verify the shared defaults match the packed commands
          command: python tests/defaults/compare.py /tmp/packed-orb.yml

  # Every public parameter of ruff/check, from the orb that orb-tools/pack
  # packed from this commit to Ruff. tests/arguments/check-parameters.py
  # runs the packed step with a recording stand-in for Ruff for every
  # parameter and every value of an enum, and with Ruff 0.16.2 for the
  # parameters whose effect it checks. It works in a temporary directory.
  # tests/arguments/check-parameters.md is the table of where each parameter
  # is tested, and the script checks that it has a row for each.
  check-parameter-tests:
    executor: ruff/default
    steps:
      - checkout
      - record-fixtures
      - locate-packed-orb

      - ruff/install:
          version: "0.16.2"

      - record-environment

      - run:
          name: Verify every parameter of ruff/check reaches Ruff
          command: >-
            python3 tests/arguments/check-parameters.py /tmp/packed-orb.yml
            --report /tmp/check-parameters

      - verify-fixtures-unchanged

      - store_artifacts:
          path: /tmp/check-parameters
          destination: check-parameters

  # ruff/install on an image the job names itself, as a user who does not
  # use the Orb's executor would run it. It does not test the 'image'
  # parameter of ruff/default; executor-image-test does.
  install-tests:
    docker:
      - image: cimg/python:3.13
    steps:
      - checkout
      - record-fixtures

      - ruff/install:
          version: "0.16.2"

      - run:
          name: Verify the pinned version was installed
          command: |
            set -euo pipefail

            ruff --version
            ruff --version | grep -Fq "0.16.2"

      - record-environment

      - ruff/check:
          targets: tests/clean

      - verify-fixtures-unchanged

  # ruff/default with an image other than its default, passed through the
  # executor's 'image' parameter rather than written into the job. The
  # resource class stays at the default. executor-comparison checks that the
  # job ran the Python of that image.
  executor-image-test:
    executor:
      name: ruff/default
      image: cimg/python:3.13
    steps:
      - checkout
      - record-fixtures

      - ruff/install:
          version: "0.16.2"

      - record-environment

      - persist_to_workspace:
          root: /tmp
          paths:
            - environment/executor-image-test.json

      - ruff/check:
          targets: tests/clean

      - verify-fixtures-unchanged

  # ruff/default with a resource class other than its default, and the
  # default image. executor-comparison checks the CPU and memory limits this
  # job recorded against those of the jobs on the default resource class.
  resource-class-test:
    executor:
      name: ruff/default
      resource_class: medium
    steps:
      - checkout
      - record-fixtures

      - ruff/install:
          version: "0.16.2"

      - record-environment

      - persist_to_workspace:
          root: /tmp
          paths:
            - environment/resource-class-test.json

      - ruff/check:
          targets: tests/clean

      - verify-fixtures-unchanged

  # Compares what the executor tests asked ruff/default for with what they
  # recorded: the image through the Python version, and the resource class
  # through the CPU and memory limits of the container. The executor's
  # defaults come from the orb packed from this commit, and what each job
  # asked for from this file. See tests/environment/compare.py.
  executor-comparison:
    docker:
      - image: cimg/python:3.13
    steps:
      - checkout
      - locate-packed-orb

      - run:
          name: Verify the executor tests ran on what they asked for
          command: >-
            python tests/environment/compare.py /tmp/packed-orb.yml
            .circleci/test-deploy.yml dist/environment
            /tmp/executor-comparison

      - store_artifacts:
          path: /tmp/executor-comparison
          destination: executor-comparison

workflows:
  test-deploy:
    jobs:
      - command-tests:
          filters: *filters

      - parameter-tests:
          filters: *filters

      - format-tests:
          filters: *filters

      - install-tests:
          filters: *filters

      - executor-image-test:
          filters: *filters

      - resource-class-test:
          filters: *filters

      - orb-tools/pack:
          filters: *filters

      - packed-command-tests:
          requires:
            - orb-tools/pack
          filters: *filters

      - check-parameter-tests:
          requires:
            - orb-tools/pack
          filters: *filters

      - executor-comparison:
          requires:
            - orb-tools/pack
            - command-tests
            - executor-image-test
            - resource-class-test
          filters: *filters

      # The only job that publishes, and the only one that uses a context. It
      # runs for a tag of the form vX.Y.Z and for nothing else, and only after
      # every job above has passed. It publishes the orb that orb-tools/pack
      # packed in this workflow, from the same commit as the Orb the tests
      # ran, and packed-command-tests has checked that very file. A tag
      # pipeline has no pull request, so the PR comment step is turned off.
      - orb-tools/publish:
          orb_name: orbss/ruff
          vcs_type: << pipeline.project.type >>
          pub_type: production
          enable_pr_comment: false
          requires:
            - orb-tools/pack
            - check-parameter-tests
            - command-tests
            - executor-comparison
            - executor-image-test
            - format-tests
            - install-tests
            - packed-command-tests
            - parameter-tests
            - resource-class-test
          context: CIRCLECI_ORBS
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
